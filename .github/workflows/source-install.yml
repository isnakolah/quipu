name: Source install proof

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  source-install:
    name: ${{ matrix.os }} source install
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
      - name: Install from source
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/quipu-bin"
          mkdir -p "$install_root"
          GOBIN="$install_root" go install ./cmd/quipu
          "$install_root/quipu" version
          "$install_root/quipu" doctor --json
      - name: Validate bundled plugins
        shell: bash
        run: |
          set -euo pipefail
          bash -n plugins/codex/quipu/scripts/session-context
          bash -n plugins/codex/quipu/scripts/pre-write-guard
          bash -n plugins/claude/quipu/scripts/session-context
          bash -n plugins/claude/quipu/scripts/pre-write-guard
          python3 -m json.tool plugins/codex/quipu/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/claude/quipu/.claude-plugin/plugin.json >/dev/null

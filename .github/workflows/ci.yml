name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.4'}
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/quipu
      - run: scripts/check-plugins.sh
